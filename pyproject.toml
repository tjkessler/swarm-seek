[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-seek"
dynamic = ["version"]
description = "Literature-validated Artificial Bee Colony optimization for Python"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Travis Kessler", email = "travis.j.kessler@gmail.com" },
]
keywords = [
    "artificial-bee-colony",
    "abc",
    "swarm-intelligence",
    "optimization",
    "metaheuristic",
    "ask-tell",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.0",
    "pre-commit>=4.0.0",
    "nbmake>=0.5.0",
]
docs = [
    "sphinx>=8.0.0",
    "furo>=2024.8.6",
    "sphinx-copybutton>=0.5.2",
]
numba = [
    "numba>=0.59.0",
]
jax = [
    "jax>=0.4.0",
]
sklearn = [
    "scikit-learn>=1.3.0",
]
optuna = [
    "optuna>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/tjkessler/swarm-seek"
Documentation = "https://swarm-seek.readthedocs.io/"
Repository = "https://github.com/tjkessler/swarm-seek"
Issues = "https://github.com/tjkessler/swarm-seek/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "swarm_seek.__version__" }

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/integrations/**" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "slow: long-running literature oracles (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["swarm_seek"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
