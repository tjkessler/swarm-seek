name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single matrix job: one pip install per Python, parallel across versions.
  # Lint / docs / notebooks only on 3.12 to keep wall clock near one install+test.
  ci:
    name: ci (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"

      - name: Ruff
        if: matrix.python-version == '3.12'
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Tests with coverage
        run: >
          pytest tests/
          -m "not slow"
          --cov=swarm_seek
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Sphinx
        if: matrix.python-version == '3.12'
        run: sphinx-build -b html -W --keep-going docs/source docs/build/html

      - name: Example notebooks
        if: matrix.python-version == '3.12'
        run: pytest --nbmake examples/ -q
